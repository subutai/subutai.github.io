<!-- Venture Card Template -->
<!-- Usage: Copy this template and customize for new entrepreneurial ventures -->
<div class="venture-card"> <!-- Add 'featured' class for current/highlighted ventures -->
    <div class="venture-header">
        <h3>Company Name</h3>
        <span class="venture-role">Your Role</span>
        <span class="venture-years">Start Year - End Year</span>
    </div>
    <div class="venture-content">
        <p>
            Description of the company, your role, and the impact or achievements.
            Include key technologies, partnerships, or market reach.
        </p>
        <div class="venture-achievements">
            <span class="achievement">Key Achievement 1</span>
            <span class="achievement">Key Achievement 2</span>
            <span class="achievement">Key Achievement 3</span>
            <!-- Add more achievements as needed -->
        </div>
        <a href="#" target="_blank" class="venture-link">Learn More →</a>
    </div>
</div>
