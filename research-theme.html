<!-- Concept 6 — "Field Notes": Per-theme detail page, hash-routed.
     NOTE: This single file handles all 6 research themes via URL hash (e.g. research-theme.html#sparsity).
     It reads location.hash, looks up the theme in the embedded data, and renders the full theme page.
     This stands in for "a separate page per theme" in the mockup — each theme gets a distinct URL+view.
     Default: first theme (cortical-theory) if no/unknown hash. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research — Subutai Ahmad</title>
<meta name="description" content="The research of Subutai Ahmad, Chief Scientist at Numenta — cortical theory and the Thousand Brains framework, sparsity for efficient AI, continual learning, anomaly detection, and earlier work in vision and neural networks.">
<meta name="author" content="Subutai Ahmad">

<!-- Open Graph (Facebook, LinkedIn, Slack, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Subutai Ahmad">
<meta property="og:title" content="Research — Subutai Ahmad">
<meta property="og:description" content="Cortical theory and the Thousand Brains framework, sparsity for efficient AI, continual learning, and more.">
<meta property="og:url" content="https://subutai.me/research-theme.html">
<meta property="og:image" content="https://subutai.me/images/Subutai_nta4.jpg">
<meta property="og:image:alt" content="Subutai Ahmad">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Research — Subutai Ahmad">
<meta name="twitter:description" content="Cortical theory and the Thousand Brains framework, sparsity for efficient AI, continual learning, and more.">
<meta name="twitter:image" content="https://subutai.me/images/Subutai_nta4.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:    #faf8f3;
    --paper2:   #f3f0e8;
    --ink:      #2d2a24;
    --ink-soft: #6b6357;
    --rule:     #d9d3c6;
    --max: 820px;
    /* theme accent — overridden by JS */
    --accent: #e07a5f;
    --accent-light: #fdf0ec;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    line-height: 1.7;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .dotted-rule {
    border: none;
    border-top: 2px dotted var(--rule);
    margin: 0;
  }

  /* ── site-level nav strip ───────────────────────────────────── */
  .site-nav {
    background: rgba(250,248,243,.95);
    backdrop-filter: blur(6px);
    border-bottom: 1px dotted var(--rule);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .site-nav-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    gap: 16px;
  }
  .back-link {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .back-link:hover { color: var(--accent); text-decoration: none; }
  .back-arrow { font-size: 16px; line-height: 1; }
  .site-name {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 300;
    color: var(--ink-soft);
  }

  /* ── theme nav pills ────────────────────────────────────────── */
  .theme-nav {
    background: var(--paper2);
    border-bottom: 1px dotted var(--rule);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .theme-nav::-webkit-scrollbar { display: none; }
  .theme-nav-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    gap: 6px;
    padding: 10px 24px;
    white-space: nowrap;
  }
  .theme-pill {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 13px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    background: white;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: none;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
  }
  .theme-pill:hover { text-decoration: none; }
  .theme-pill.active {
    color: white;
    border-color: transparent;
  }

  /* ── main layout ────────────────────────────────────────────── */
  .page-wrap {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── theme header ───────────────────────────────────────────── */
  .theme-header {
    padding: 52px 0 36px;
    border-bottom: 1px dotted var(--rule);
  }
  .theme-era-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 3px 10px;
    margin-bottom: 14px;
    background: var(--accent-light);
    color: var(--accent);
  }
  .theme-name {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 400;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .theme-tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-weight: 300;
    color: var(--ink-soft);
    margin-bottom: 20px;
    max-width: 560px;
  }
  .theme-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .kw {
    background: var(--accent-light);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 12px;
    font-weight: 600;
  }

  /* ── theme body ─────────────────────────────────────────────── */
  .theme-body {
    padding: 36px 0;
    border-bottom: 1px dotted var(--rule);
  }
  .theme-body-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .theme-body p {
    color: var(--ink-soft);
    margin-bottom: 18px;
    max-width: 620px;
    font-size: 1rem;
  }
  .theme-body p:last-child { margin-bottom: 0; }

  /* ── accent bar on left of body ─────────────────────────────── */
  .theme-body-text {
    border-left: 3px solid var(--accent);
    padding-left: 20px;
    margin-left: 0;
  }

  /* ── theme figures (two image placeholders per theme) ───────── */
  .theme-media { padding: 26px 0 0; }
  .theme-figure { margin: 0; }
  .theme-figure img { width: 100%; border-radius: 10px; display: block; box-shadow: 0 6px 22px rgba(0,0,0,.1); }
  .theme-figure figcaption { font-size: 12px; color: var(--ink-soft); font-style: italic; text-align: center; margin-top: 8px; }
  .fig-placeholder {
    border: 1.5px dashed var(--accent);
    background: var(--accent-light);
    border-radius: 10px;
    min-height: 150px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 22px; gap: 5px;
  }
  .fig-placeholder .fig-ic   { font-size: 24px; opacity: .65; }
  .fig-placeholder .fig-main { font-weight: 700; color: var(--accent); font-size: 14px; }
  .fig-placeholder .fig-sub  { font-size: 12px; color: var(--ink-soft); max-width: 420px; }
  .fig-placeholder code {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    background: rgba(0,0,0,.05); padding: 1px 6px; border-radius: 4px;
  }
  #theme-fig-1 .fig-placeholder { min-height: 190px; }
  #theme-fig-2 .fig-placeholder { min-height: 140px; }

  /* ── publication link chips ─────────────────────────────────── */
  .pub-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pub-link {
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--rule); background: white; color: var(--ink-soft);
    text-decoration: none; white-space: nowrap;
    transition: border-color .15s, color .15s;
  }
  a.pub-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .pub-link.placeholder { border-style: dashed; color: #b1a78f; background: transparent; cursor: help; }

  /* ── publications for theme ─────────────────────────────────── */
  .theme-pubs {
    padding: 36px 0 60px;
  }
  .theme-pubs-label {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .theme-pubs-count {
    font-size: .9rem;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }

  .pub-item {
    padding: 16px 0;
    border-bottom: 1px dotted var(--rule);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0 14px;
    align-items: start;
  }
  .pub-year-badge {
    font-size: 11px;
    font-weight: 700;
    color: white;
    border-radius: 4px;
    padding: 3px 7px;
    white-space: nowrap;
    margin-top: 3px;
    background: var(--accent);
  }
  .pub-title {
    font-family: 'Fraunces', serif;
    font-size: .95rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .pub-title a { color: inherit; }
  .pub-title a:hover { color: var(--accent); }
  .pub-meta {
    font-size: .82rem;
    color: var(--ink-soft);
  }
  .pub-meta .cite {
    font-style: italic;
  }

  /* ── other themes ───────────────────────────────────────────── */
  .other-themes {
    background: var(--paper2);
    border-top: 1px dotted var(--rule);
    padding: 40px 24px;
  }
  .other-themes-inner {
    max-width: var(--max);
    margin: 0 auto;
  }
  .other-themes-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .other-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .other-pill {
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: white;
    color: var(--ink-soft);
    text-decoration: none;
    transition: border-color .15s, color .15s;
  }
  .other-pill:hover { text-decoration: none; }

  /* ── footer ─────────────────────────────────────────────────── */
  footer {
    background: var(--paper);
    border-top: 1px dotted var(--rule);
    padding: 28px 24px;
    text-align: center;
  }
  footer a {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  footer a:hover { color: var(--accent); }

  /* ── mobile pass ────────────────────────────────────────────── */
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .page-wrap { padding: 0 18px; }
    .site-nav { padding: 0 16px; }
    .theme-header { padding: 34px 0 26px; }
    .theme-nav-inner { padding: 10px 16px; }
    .theme-body { padding: 26px 0; }
    .theme-body-text { padding-left: 14px; }
    .theme-pubs { padding: 28px 0 44px; }
    .other-themes { padding: 32px 16px; }
  }
</style>
</head>
<body>

<!-- site nav -->
<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="back-link" href="index.html">
      <span class="back-arrow">←</span> Back to home
    </a>
    <span class="site-name">Subutai Ahmad</span>
  </div>
</nav>

<!-- theme switcher pills -->
<div class="theme-nav">
  <div class="theme-nav-inner" id="theme-nav-inner"></div>
</div>

<!-- main content -->
<div class="page-wrap">
  <div class="theme-header">
    <div class="theme-era-badge" id="era-badge"></div>
    <h1 class="theme-name" id="theme-name"></h1>
    <p class="theme-tagline" id="theme-tagline"></p>
    <div class="theme-keywords" id="theme-keywords"></div>
  </div>

  <!-- Image placeholder #1 (lead image). Auto-swaps to images/research/<slug>-1.jpg when present. -->
  <div class="theme-media" id="theme-fig-1"></div>

  <div class="theme-body">
    <div class="theme-body-label">About this research</div>
    <div class="theme-body-text" id="theme-body-text"></div>
  </div>

  <!-- Image placeholder #2 (supporting image). Auto-swaps to images/research/<slug>-2.jpg when present. -->
  <div class="theme-media" id="theme-fig-2"></div>

  <div class="theme-pubs">
    <h2 class="theme-pubs-label" id="pubs-label">Publications</h2>
    <p class="theme-pubs-count" id="pubs-count"></p>
    <ul id="pub-list" style="list-style:none"></ul>
  </div>
</div>

<!-- other themes -->
<div class="other-themes">
  <div class="other-themes-inner">
    <div class="other-themes-label">Other research themes</div>
    <div class="other-grid" id="other-grid"></div>
  </div>
</div>

<footer>
  <a href="index.html">← Back to home</a>
</footer>

<!-- publication data (single source of truth — see publications.js) -->
<script src="publications.js"></script>
<!-- research theme data (single source of truth — see themes.js) -->
<script src="themes.js"></script>
<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

// ── Research themes ───────────────────────────────────────────────────────────
// The THEMES array is loaded from themes.js (single source of truth — edit there).

// ── Publications data ─────────────────────────────────────────────────────────
// The PUBS array is loaded from publications.js (the single source of truth).
// Edit your publication list and tags THERE — both pages read the same file.

const AREA_COLOR_HEX = {
  "Cortical Theory & HTM":          "#e07a5f",
  "Sparsity & Efficient AI":        "#81b29a",
  "Anomaly Detection & Streaming":  "#f2cc8f",
  "Continual Learning":             "#6a8fc8",
  "Vision & Attention":             "#c19abf",
  "Neural Networks (foundations)":  "#a8c4a2"
};

// Light tints for accent-light
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// A publication can carry MORE THAN ONE tag (`areas` list). A paper shows up on
// every theme page whose area is in its list.
function pubAreas(p) { return Array.isArray(p.areas) ? p.areas : (p.area ? [p.area] : []); }

// ── publication source + PDF chips ───────────────────────────────────────────
function sourceLabel(url) {
  if (/arxiv\.org/i.test(url))                    return 'arXiv';
  if (/biorxiv/i.test(url))                       return 'bioRxiv';
  if (/frontiersin|doi\.org|\/10\.\d/i.test(url)) return 'Published version';
  return 'Link';
}
// Source uses p.link if present; PDF uses p.pdf if present; otherwise a
// placeholder for Subutai to fill (set "pdf":"papers/your-file.pdf" on a paper).
function pubLinksHtml(p) {
  const src = p.link
    ? `<a class="pub-link" href="${p.link}" target="_blank" rel="noopener">${sourceLabel(p.link)} ↗</a>`
    : `<span class="pub-link placeholder" title="No source URL yet — add the journal / conference / arXiv link">＋ add source link</span>`;
  const pdf = p.pdf
    ? `<a class="pub-link" href="${p.pdf}" target="_blank" rel="noopener">PDF ↓</a>`
    : `<span class="pub-link placeholder" title="Add a PDF: put the file in the repo (e.g. papers/…) and set this paper's pdf field">＋ add PDF</span>`;
  return `<div class="pub-links">${src}${pdf}</div>`;
}

// ── theme figures (two image placeholders, auto-swap when a file exists) ──────
function figPlaceholderHTML(base, hint) {
  return `<div class="fig-placeholder">
    <div class="fig-ic">🖼️</div>
    <div class="fig-main">Image placeholder</div>
    <div class="fig-sub">${hint}<br>Drop a file at <code>${base}.jpg</code> (or .png / .gif / .webp) and it appears here.</div>
  </div>`;
}
// `base` is the path WITHOUT an extension, e.g. "images/research/sparsity-1".
// We try several formats and use whichever file actually exists (.jpg/.png/.gif/.webp).
// opts: { hint } placeholder text while empty; { caption } shown under a real image
// (omit/"" → no caption); { scale } 0–1 to shrink the DISPLAYED size (e.g. 0.4 = 40%).
function renderFigure(id, base, opts) {
  opts = opts || {};
  const el = document.getElementById(id);
  el.innerHTML = `<figure class="theme-figure">${figPlaceholderHTML(base, opts.hint || '')}</figure>`;
  const exts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
  let i = 0;
  (function tryNext() {
    if (i >= exts.length) return;            // none found → keep the placeholder
    const src = `${base}.${exts[i++]}`;
    const img = new Image();
    img.onload  = () => {
      const imgStyle = opts.scale ? ` style="width:${Math.round(opts.scale * 100)}%;margin-inline:auto;"` : '';
      const cap = opts.caption ? `<figcaption>${opts.caption}</figcaption>` : '';
      el.innerHTML = `<figure class="theme-figure"><img src="${src}" alt=""${imgStyle}>${cap}</figure>`;
    };
    img.onerror = tryNext;                    // this format missing → try the next
    img.src = src;
  })();
}

// ─── ROUTING ─────────────────────────────────────────────────────────────────

function getTheme() {
  const hash = (location.hash || '').replace('#', '').trim();
  return THEMES.find(t => t.slug === hash) || THEMES[0];
}

function render() {
  const theme = getTheme();
  const color = AREA_COLOR_HEX[theme.area] || '#e07a5f';
  const tint  = hexToRgba(color, 0.12);

  // Update CSS vars
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-light', tint);

  // Page title
  document.title = `${theme.name} — Subutai Ahmad`;

  // Era badge
  const eraBadge = document.getElementById('era-badge');
  eraBadge.textContent = theme.era === 'current' ? 'Current research focus' : 'Earlier work';

  // Name & tagline
  document.getElementById('theme-name').textContent     = theme.name;
  document.getElementById('theme-tagline').textContent  = theme.tagline;

  // Keywords
  const kwEl = document.getElementById('theme-keywords');
  kwEl.innerHTML = theme.keywords.map(k => `<span class="kw">${k}</span>`).join('');

  // Body text
  const bodyEl = document.getElementById('theme-body-text');
  bodyEl.innerHTML = theme.body.map(p => `<p>${p}</p>`).join('');

  // Two image placeholders (auto-swap to real images once the files exist)
  // Per-image caption/scale come from the theme's optional fig1 / fig2 in themes.js.
  const fig1 = theme.fig1 || {}, fig2 = theme.fig2 || {};
  renderFigure('theme-fig-1', `images/research/${theme.slug}-1`,
    { hint: 'A lead image for this theme — a key figure or a relevant photo.', caption: fig1.caption || '', scale: fig1.scale });
  renderFigure('theme-fig-2', `images/research/${theme.slug}-2`,
    { hint: 'A second supporting image or diagram.', caption: fig2.caption || '', scale: fig2.scale });

  // Publications filtered by area, sorted by citation count (most cited first)
  const themePubs = PUBS
    .filter(p => pubAreas(p).includes(theme.area))
    .sort((a,b) => b.citations - a.citations);

  document.getElementById('pubs-label').textContent = 'Publications in this area';
  document.getElementById('pubs-count').textContent =
    `${themePubs.length} paper${themePubs.length !== 1 ? 's' : ''}, most cited first`;

  const pubList = document.getElementById('pub-list');
  pubList.innerHTML = '';
  if (themePubs.length === 0) {
    pubList.innerHTML = '<li style="color:var(--ink-soft);padding:16px 0;font-style:italic">No publications in this area yet.</li>';
  } else {
    themePubs.forEach(p => {
      const titleHtml = p.link
        ? `<a href="${p.link}" target="_blank">${p.title}</a>`
        : p.title;
      const citeHtml = p.citations > 0
        ? ` · <span class="cite">${p.citations.toLocaleString()} citations</span>` : '';
      const li = document.createElement('li');
      li.className = 'pub-item';
      li.innerHTML = `
        <span class="pub-year-badge">${p.year}</span>
        <div>
          <div class="pub-title">${titleHtml}</div>
          <div class="pub-meta">${p.authors} · ${p.venue}${citeHtml}</div>
          ${pubLinksHtml(p)}
        </div>`;
      pubList.appendChild(li);
    });
  }

  // Theme nav pills
  const navEl = document.getElementById('theme-nav-inner');
  navEl.innerHTML = '';
  THEMES.forEach(t => {
    const c = AREA_COLOR_HEX[t.area];
    const a = document.createElement('a');
    a.href = `research-theme.html#${t.slug}`;
    a.className = 'theme-pill' + (t.slug === theme.slug ? ' active' : '');
    a.textContent = t.name;
    if (t.slug === theme.slug) {
      a.style.background = c;
      a.style.borderColor = c;
    } else {
      a.style.borderColor = hexToRgba(c, 0.4);
      a.style.color = c;
    }
    navEl.appendChild(a);
  });

  // Other themes grid
  const otherGrid = document.getElementById('other-grid');
  otherGrid.innerHTML = '';
  THEMES.filter(t => t.slug !== theme.slug).forEach(t => {
    const c = AREA_COLOR_HEX[t.area];
    const a = document.createElement('a');
    a.href = `research-theme.html#${t.slug}`;
    a.className = 'other-pill';
    a.textContent = t.name;
    a.style.borderColor = hexToRgba(c, 0.5);
    a.style.color = c;
    a.addEventListener('mouseover', () => { a.style.borderColor = c; });
    a.addEventListener('mouseout',  () => { a.style.borderColor = hexToRgba(c, 0.5); });
    otherGrid.appendChild(a);
  });

  // Scroll to top on navigation
  window.scrollTo(0, 0);
}

// ─── INIT ────────────────────────────────────────────────────────────────────

render();
window.addEventListener('hashchange', render);
</script>
</body>
</html>
